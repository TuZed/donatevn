<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng ghi nhận tham gia</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f8;
    color: #252344;
}

header {
    background: linear-gradient(90deg,#4f46e5,#9333ea);
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin-bottom: 0;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 15px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #0001;
    margin-bottom: 25px;
}

.form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 15px;
    align-items: end;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.add {
    background: #6d45dc;
    color: white;
}

.delete {
    background: #e84c69;
    color: white;
    margin-top: 15px;
}

/* THỐNG KÊ */

.stats {
    display: flex;
    gap: 20px;
    margin-top: 25px;
}

.stat {
    flex: 1;
    padding: 20px;
    background: #f1edff;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 27px;
    color: #7044d6;
    margin-bottom: 5px;
}

/* MÀN HÌNH CHẠY CHỮ */

.display {
    background: #211b42;
    color: white;
    padding: 10px;
    border-radius: 1px;
    overflow: hidden;
}

.display h2 {
    text-align: center;
    color: #ffdf57;
    margin: 0 0 10px 10px;
}

.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
}

/* .track {
    display: flex;
    width: max-content;
    animation: scroll 1s linear infinite;
} */

.track {
    display: flex;
    width: max-content;
    will-change: transform;
}

/* .marquee:hover .track {
    animation-play-state: paused;
} */

.group {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 20px;
    padding-right: 10px;
}

.item {
    background: #40346f;
    padding: 10px 20px;
    border-radius: 15px;
    min-width: 150px;
    min-height: 40px;
    text-align: center;
    border: 1px solid #8068c9;
}

.item .name {
    font-size: 21px;
    font-weight: bold;
    color: white;
}

.item .money {
    font-size: 19px;
    color: #ffdf57;
    margin-top: 8px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #ddd;
    font-size: 20px;
}

@keyframes scroll {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-150%);
    }
}

/* DANH SÁCH */

/* .list-title {
    margin-top: 30px;
} */

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f1edff;
    color: #5334a3;
}

@media(max-width:700px) {
    .form {
        grid-template-columns: 1fr;
    }

    .stats {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>✨ BẢNG GHI NHẬN THAM GIA ✨</h1>
    <p>HỆ THỐNG QUẢN LÝ DANH SÁCH VÀ SỐ TIỀN</p>
</header>

<div class="container">

    <section class="panel">
        <h2>📝 Nhập thông tin</h2>

        <form id="form" class="form">

            <div>
                <label>Họ và tên</label>
                <input id="name" placeholder="Nhập họ tên..." required>
            </div>

            <div>
                <label>Số tiền (VNĐ)</label>
                <input id="money" type="number"
                       min="0" step="1"
                       placeholder="Nhập số tiền..." required>
            </div>

            <button class="add" type="submit">
                + THÊM VÀO DANH SÁCH
            </button>

        </form>

        <div class="stats">
            <div class="stat">
                <strong id="count">0</strong>
                SỐ NGƯỜI THAM GIA
            </div>

            <div class="stat">
                <strong id="total">0đ</strong>
                TỔNG SỐ TIỀN
            </div>
        </div>

        <button class="delete" id="clear">
            XÓA TOÀN BỘ
        </button>
    </section>

    <!-- MÀN HÌNH CHẠY CHỮ -->

    <section class="display">
        <h2>🌟 DANH SÁCH ỦNG HỘ 🌟</h2>
        <div class="marquee">
            <div class="track" id="track">
                <div class="group" id="group1">
                </div>
                <div class="group" id="group2" aria-hidden="true"></div>
            </div>
        </div>
    </section>

    <!-- BẢNG DANH SÁCH -->

    <section class="panel list-title">
        <h2>📋 LỊCH SỬ GHI NHẬN</h2>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>Số tiền</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </section>

</div>

<script>
const KEY = "danh_sach_tham_gia_v2";

let people = [];

try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (Array.isArray(saved)) people = saved;
} catch(e) {
    people = [];
}

const form = document.getElementById("form");
const track = document.getElementById("track");
const group1 = document.getElementById("group1");
const group2 = document.getElementById("group2");
const tableBody = document.getElementById("tableBody");

const marquee = document.querySelector(".marquee");

let tickerItems = [];
let tickerFrame = null;
let tickerX = 0;
let lastTime = 0;
const SPEED = 150; // Tốc độ pixel/giây

function formatMoney(n) {
    return Number(n).toLocaleString("vi-VN") + "đ";
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(people));
}

function makeItem(person) {
    const box = document.createElement("div");
    box.className = "item";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = person.name;

    const money = document.createElement("div");
    money.className = "money";
    money.textContent = formatMoney(person.money);

    box.append(name, money);
    return box;
}

function startTicker() {
    cancelAnimationFrame(tickerFrame);

    tickerItems = [...group1.children];

    // Bắt đầu từ ngoài mép phải
    tickerX = marquee.clientWidth;
    lastTime = 0;

    track.style.transform = `translateX(${tickerX}px)`;

    function move(now) {
        if (!lastTime) lastTime = now;

        const delta = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        tickerX -= SPEED * delta;

        if (tickerX < -group1.scrollWidth) {
            tickerX = marquee.clientWidth;
        }

        track.style.transform = `translateX(${tickerX}px)`;

        tickerFrame = requestAnimationFrame(move);
    }

    tickerFrame = requestAnimationFrame(move);
}

function render() {
    // Người mới nhất đứng đầu danh sách
    group1.replaceChildren();
    group2.replaceChildren();

    if (people.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Trường THPT chuyên Nguyễn Chí Thanh - Lâm Đồng";
        group1.appendChild(empty);
        group2.appendChild(empty.cloneNode(true));
    } else {
        people.forEach(person => {
            group1.appendChild(makeItem(person));
        });

        // Nhân đôi danh sách để chạy liên tục
        // people.forEach(person => {
        //     group2.appendChild(makeItem(person));
        // });
    }

    // Bảng lịch sử: mới nhất trước
    tableBody.replaceChildren();

    people.forEach((person, index) => {
        const row = document.createElement("tr");

        const stt = document.createElement("td");
        stt.textContent = index + 1;

        const name = document.createElement("td");
        name.textContent = person.name;

        const money = document.createElement("td");
        money.textContent = formatMoney(person.money);

        row.append(stt, name, money);
        tableBody.appendChild(row);
    });

    document.getElementById("count").textContent = people.length;

    const sum = people.reduce(
        (total, person) => total + Number(person.money), 0
    );

    document.getElementById("total").textContent =
        formatMoney(sum);

    // // Tự điều chỉnh tốc độ theo số lượng nội dung
    // const duration = Math.max(12, people.length * 5);
    // track.style.animationDuration = duration + "s";

    startTicker();

    save();
}

// Thêm người mới lên đầu danh sách
form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const moneyInput = document.getElementById("money");
    const money = Number(moneyInput.value);

    if (!name || moneyInput.value === "" ||
        !Number.isFinite(money) || money < 0) {
        alert("Vui lòng nhập tên và số tiền hợp lệ!");
        return;
    }

    people.unshift({
        name: name,
        money: money
    });

    render();

    form.reset();
    document.getElementById("name").focus();
});

// Xóa danh sách
document.getElementById("clear").addEventListener("click", function() {
    if (confirm("Bạn có chắc muốn xóa toàn bộ danh sách?")) {
        people = [];
        render();
    }
});

render();
</script>

</body>
</html>
