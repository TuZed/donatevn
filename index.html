<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng ghi nhận tham gia</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f8;
    color: #252344;
}

header {
    background: linear-gradient(90deg,#4f46e5,#9333ea);
    color: white;
    text-align: center;
    padding: 25px;
}
header h1 { margin: 0; font-size: 32px; }
header p { margin-bottom: 0; }

.container { max-width: 1200px; margin: 30px auto; padding: 15px; }

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #0001;
    margin-bottom: 25px;
}

.status-bar {
    min-height: 22px;
    font-size: 14px;
    margin-bottom: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    display: none;
}
.status-bar.is-visible { display: block; }
.status-bar--error   { background: #fde8ec; color: #a11d33; }
.status-bar--success { background: #e6f7ee; color: #136c3a; }
.status-bar--info    { background: #eef2ff; color: #3730a3; }

.form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 15px;
    align-items: end;
}

label { display: block; margin-bottom: 8px; font-weight: bold; }

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}
button:disabled { opacity: 0.6; cursor: not-allowed; }

.add    { background: #6d45dc; color: white; }
.delete { background: #e84c69; color: white; margin-top: 15px; }

.stats { display: flex; gap: 20px; margin-top: 25px; }
.stat {
    flex: 1;
    padding: 20px;
    background: #f1edff;
    border-radius: 12px;
    text-align: center;
}
.stat strong {
    display: block;
    font-size: 27px;
    color: #7044d6;
    margin-bottom: 5px;
}

.display {
    background: #211b42;
    color: white;
    padding: 10px;
    overflow: hidden;
}
.display h2 { text-align: center; color: #ffdf57; margin: 0 0 10px 10px; }

.marquee { width: 100%; overflow: hidden; white-space: nowrap; }
.track { display: flex; width: max-content; will-change: transform; }
.group { display: flex; flex-shrink: 0; align-items: center; gap: 20px; padding-right: 10px; }
.item {
    background: #40346f;
    padding: 10px 20px;
    border-radius: 15px;
    min-width: 150px;
    min-height: 40px;
    text-align: center;
    border: 1px solid #8068c9;
}
.item .name  { font-size: 21px; font-weight: bold; color: white; }
.item .money { font-size: 19px; color: #ffdf57; margin-top: 8px; font-weight: bold; }
.empty { text-align: center; padding: 35px; color: #ddd; font-size: 20px; }

table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { padding: 14px; border-bottom: 1px solid #eee; text-align: left; }
th { background: #f1edff; color: #5334a3; }

@media(max-width:700px) {
    .form { grid-template-columns: 1fr; }
    .stats { flex-direction: column; }
}
</style>
</head>

<body>

<header>
    <h1>✨ BẢNG GHI NHẬN THAM GIA ✨</h1>
    <p>HỆ THỐNG QUẢN LÝ DANH SÁCH VÀ SỐ TIỀN</p>
</header>

<div class="container">

    <section class="panel">
        <h2>📝 Nhập thông tin</h2>

        <div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>

        <form id="form" class="form">
            <div>
                <label>Họ và tên</label>
                <input id="name" placeholder="Nhập họ tên..." required>
            </div>
            <div>
                <label>Số tiền (VNĐ)</label>
                <input id="money" type="number" min="0" step="1"
                       placeholder="Nhập số tiền..." required>
            </div>
            <button class="add" type="submit" id="addBtn">+ THÊM VÀO DANH SÁCH</button>
        </form>

        <div class="stats">
            <div class="stat"><strong id="count">0</strong>SỐ NGƯỜI THAM GIA</div>
            <div class="stat"><strong id="total">0đ</strong>TỔNG SỐ TIỀN</div>
        </div>

        <button class="delete" id="clear" type="button">XÓA TOÀN BỘ</button>
    </section>

    <section class="display">
        <h2>🌟 DANH SÁCH ỦNG HỘ 🌟</h2>
        <div class="marquee">
            <div class="track" id="track">
                <div class="group" id="group1"></div>
                <div class="group" id="group2" aria-hidden="true"></div>
            </div>
        </div>
    </section>

    <section class="panel list-title">
        <h2>📋 LỊCH SỬ GHI NHẬN</h2>
        <table>
            <thead>
                <tr><th>STT</th><th>Họ tên</th><th>Số tiền</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </section>

</div>

<script>
/* ========== CẤU HÌNH ========== */
const SUPABASE_URL      = "https://ktrapgpglbsqukipzook.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nRjbF6SkyRBoh_3wzevbeA_G9XOdDGc";

/* ========== DOM ========== */
const form      = document.getElementById("form");
const track     = document.getElementById("track");
const group1    = document.getElementById("group1");
const group2    = document.getElementById("group2");
const tableBody = document.getElementById("tableBody");
const marquee   = document.querySelector(".marquee");
const statusBar = document.getElementById("statusBar");
const addBtn    = document.getElementById("addBtn");
const clearBtn  = document.getElementById("clear");
const countEl   = document.getElementById("count");
const totalEl   = document.getElementById("total");

/* ========== STATE ========== */
let people = [];
let isLoading = false;
let isMutating = false;

/* ========== TIỆN ÍCH ========== */
function formatMoney(n) {
    return Number(n).toLocaleString("vi-VN") + "đ";
}

function showStatus(msg, type = "info") {
    statusBar.textContent = msg;
    statusBar.className = "status-bar is-visible status-bar--" + type;
}

function hideStatus() {
    statusBar.className = "status-bar";
    statusBar.textContent = "";
}

function setBusy() {
    const busy = isMutating || isLoading;
    addBtn.disabled = busy;
    clearBtn.disabled = busy;
}

/* ========== GỌI SUPABASE REST API TRỰC TIẾP (KHÔNG CẦN CDN) ========== */
async function supabaseFetch(path, options = {}) {
    const url = SUPABASE_URL + "/rest/v1" + path;
    const res = await fetch(url, {
        ...options,
        headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

    let body = null;
    const text = await res.text();
    if (text) {
        try { body = JSON.parse(text); } catch (_) { body = text; }
    }

    if (!res.ok) {
        const detail = (body && (body.message || body.hint || body.details)) || res.statusText;
        const err = new Error(`HTTP ${res.status} — ${detail}`);
        err.status = res.status;
        err.body = body;
        throw err;
    }

    return body;
}

async function fetchPeople() {
    return await supabaseFetch(
        "/people?select=id,name,money&order=id.desc"
    );
}

async function insertPerson(name, money) {
    return await supabaseFetch("/people", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify([{ name, money }])
    });
}

async function deleteAllPeople() {
    // PostgREST: điều kiện "id > 0" phủ toàn bộ bản ghi
    return await supabaseFetch("/people?id=gt.0", {
        method: "DELETE",
        headers: { "Prefer": "" }
    });
}

/* ========== MARQUEE ========== */
let tickerFrame = null;
let tickerX = 0;
let lastTime = 0;
const SPEED = 150;

function makeItem(person) {
    const box = document.createElement("div");
    box.className = "item";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = person.name;

    const money = document.createElement("div");
    money.className = "money";
    money.textContent = formatMoney(person.money);

    box.append(name, money);
    return box;
}

function startTicker() {
    cancelAnimationFrame(tickerFrame);
    tickerX = marquee.clientWidth;
    lastTime = 0;
    track.style.transform = `translateX(${tickerX}px)`;

    function move(now) {
        if (!lastTime) lastTime = now;
        const delta = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        tickerX -= SPEED * delta;
        if (tickerX < -group1.scrollWidth) {
            tickerX = marquee.clientWidth;
        }
        track.style.transform = `translateX(${tickerX}px)`;
        tickerFrame = requestAnimationFrame(move);
    }
    tickerFrame = requestAnimationFrame(move);
}

/* ========== RENDER ========== */
function render() {
    group1.replaceChildren();
    group2.replaceChildren();

    if (people.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Trường THPT chuyên Nguyễn Chí Thanh - Lâm Đồng";
        group1.appendChild(empty);
        group2.appendChild(empty.cloneNode(true));
    } else {
        people.forEach(p => group1.appendChild(makeItem(p)));
    }

    tableBody.replaceChildren();
    people.forEach((person, index) => {
        const row = document.createElement("tr");
        const stt = document.createElement("td");   stt.textContent = index + 1;
        const n   = document.createElement("td");   n.textContent   = person.name;
        const m   = document.createElement("td");   m.textContent   = formatMoney(person.money);
        row.append(stt, n, m);
        tableBody.appendChild(row);
    });

    countEl.textContent = people.length;
    const sum = people.reduce((t, p) => t + Number(p.money), 0);
    totalEl.textContent = formatMoney(sum);

    startTicker();
}

/* ========== LOAD ========== */
async function loadPeople() {
    isLoading = true;
    setBusy();

    try {
        const data = await fetchPeople();
        people = (data || []).map(p => ({
            id: p.id,
            name: String(p.name),
            money: Number(p.money)
        }));
        render();
        // Nếu trước đó có lỗi, giờ đã thành công → xóa lỗi
        if (statusBar.classList.contains("status-bar--error")) {
            hideStatus();
        }
    } catch (err) {
        console.error("Lỗi tải dữ liệu:", err);
        showStatus("Không tải được dữ liệu: " + err.message, "error");
    } finally {
        isLoading = false;
        setBusy();
    }
}

/* ========== SỰ KIỆN ========== */
form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (isMutating || isLoading) return;

    const nameInput  = document.getElementById("name");
    const moneyInput = document.getElementById("money");

    const name  = nameInput.value.trim();
    const money = Number(moneyInput.value);

    if (!name || moneyInput.value === "" ||
        !Number.isFinite(money) || money < 0) {
        showStatus("Vui lòng nhập tên và số tiền hợp lệ!", "error");
        return;
    }

    isMutating = true;
    setBusy();
    showStatus("Đang lưu…", "info");

    try {
        await insertPerson(name, money);
        form.reset();
        nameInput.focus();
        await loadPeople();
        showStatus("Đã thêm thành công.", "success");
        setTimeout(hideStatus, 2500);
    } catch (err) {
        console.error("Lỗi thêm dữ liệu:", err);
        showStatus("Không lưu được: " + err.message, "error");
    } finally {
        isMutating = false;
        setBusy();
    }
});

clearBtn.addEventListener("click", async function () {
    if (isMutating || isLoading) return;
    if (!confirm("Bạn có chắc muốn xóa toàn bộ danh sách?")) return;

    isMutating = true;
    setBusy();
    showStatus("Đang xóa…", "info");

    try {
        await deleteAllPeople();
        await loadPeople();
        showStatus("Đã xóa toàn bộ danh sách.", "success");
        setTimeout(hideStatus, 2500);
    } catch (err) {
        console.error("Lỗi xóa dữ liệu:", err);
        showStatus("Không xóa được: " + err.message, "error");
    } finally {
        isMutating = false;
        setBusy();
    }
});

/* ========== REALTIME (tùy chọn) + POLLING (luôn chạy) ========== */
function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Không tải được " + src));
        document.head.appendChild(s);
    });
}

async function setupRealtime() {
    try {
        // Thử tải thư viện để có realtime tức thời
        await loadScriptOnce(
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
        );
        if (!window.supabase) throw new Error("window.supabase undefined");

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        client
            .channel("people-changes")
            .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "people" },
                () => loadPeople()
            )
            .subscribe(status => {
                if (status === "SUBSCRIBED") {
                    console.log("[Realtime] Đã kết nối.");
                } else if (status === "CHANNEL_ERROR") {
                    console.warn("[Realtime] Lỗi channel — kiểm tra publication supabase_realtime.");
                }
            });
    } catch (err) {
        console.warn("[Realtime] Không dùng được thư viện, chuyển sang polling:", err.message);
    }

    // Polling là lưới an toàn: luôn cập nhật mỗi 5 giây
    setInterval(loadPeople, 5000);
}

/* ========== KHỞI TẠO ========== */
showStatus("Đang kết nối Supabase…", "info");
loadPeople();
setupRealtime();
</script>

</body>
</html>
